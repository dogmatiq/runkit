edition = "2024";
package runkit.cluster.v1;

option go_package = "github.com/dogmatiq/runkit/internal/cluster/internal/heartbeatpb";

import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";
import "google/protobuf/duration.proto";

// Heartbeat is a message by which a node tells the whole cluster, itself
// included, that it is live.
//
// Nodes ignore unknown fields in a heartbeat, so a later release may add fields
// to this message. See docs/maintainers/heartbeats.md for the rules that keep
// it compatible.
message Heartbeat {
  // NodeId is the ID of the node that sent the heartbeat.
  dogma.protobuf.v1.UUID node_id = 1;

  // ExpiresAfter is how long the heartbeat keeps its sender live. A node that
  // receives the heartbeat counts that time from the moment of receipt, and
  // removes the sender from its live nodes if the sender sends no newer
  // heartbeat within that time.
  google.protobuf.Duration expires_after = 2;
}
